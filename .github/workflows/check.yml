name: Probe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse probe Lua
        run: |
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find probe -name '*.lua' -print0)
      - name: Offline behavior tests
        run: lua5.1 qa/mock_probe.lua probe/MagicMarkerForeverProbe/Probe.lua
      - name: Build and validate ZIP
        run: python3 tools/package_probe.py
